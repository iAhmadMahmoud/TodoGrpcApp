syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "TodoServer";

package todo;


service TodoService {
  rpc CreateTodo (CreateTodoRequest) returns (TodoItem);
  rpc GetTodo (GetTodoRequest) returns (TodoItem);
  rpc ListTodo (EmptyRequest) returns (TodoListResponse);
  rpc ListDeletedTodos (EmptyRequest) returns (TodoListResponse);
  rpc ToggleTodo (ToggleTodoRequest) returns (TodoItem);
  rpc DeleteTodo (DeleteTodoRequest) returns (DeleteTodoResponse);
  rpc GetAllTodosIncludingDeleted (EmptyRequest) returns (TodoListResponse);
}

message EmptyRequest {
  
}

message TodoItem {
  int32 id = 1;
  string title = 2;
  bool is_completed = 3;
  bool is_deleted = 4;
  google.protobuf.Timestamp deleted_at_utc = 5;
}

message CreateTodoRequest {
  string title = 1;
}

message GetTodoRequest {
  int32 id = 1;
}

message ToggleTodoRequest {
  int32 id = 1;
}

message UpdateTodoRequest {
  int32 id = 1;
}

message DeleteTodoRequest {
  int32 id = 1;
}

message DeleteTodoResponse {
  bool success = 1;
}

message TodoListResponse {
  repeated TodoItem items = 1;
}
